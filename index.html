<style>
/* 競技場の昼。トラックの赤土色、マットの青、バーの黄色。画面は競技場の場内表示と記録用紙 */
:root{
  --sky:#CFE3EC; --sky2:#EAF2F2;
  --tartan:#C4553A; --tartan-d:#9E3F2A;
  --ink:#1D2433; --ink2:#4A5468;
  --paper:#FBF8F1; --line:#D9D2C2;
  --mat:#2E5FA8; --signal:#F2C230; --ok:#2F8F5B; --ng:#C23B2A;
  --f-disp:'Mochiy Pop P One','M PLUS 2',system-ui,sans-serif;
  --f-body:'M PLUS 2','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-num:'Barlow Condensed','M PLUS 2',system-ui,sans-serif;
  color-scheme: light;
}
html,body{height:100%;}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
#app{position:fixed;inset:0;}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;}
button{font-family:var(--f-body);touch-action:manipulation;cursor:pointer;}
button:focus-visible{outline:3px solid var(--signal);outline-offset:2px;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding-top:max(12px, env(safe-area-inset-top,0px));padding-bottom:max(12px, env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));box-sizing:border-box;}
.btn{border:0;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:800;background:var(--ink);color:var(--paper);box-shadow:0 3px 0 #0007;}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0007;}
.btn.sub{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink),0 3px 0 #0003;}
.btn.go{background:var(--tartan);}
.btn:disabled{opacity:.35;cursor:default;transform:none;}

/* タイトル：記録会のプログラム */
#title{justify-content:flex-start;background:linear-gradient(#cfe3ecf4 0%,#cfe3ecdc 58%,#cfe3ec00 80%);overflow-y:auto;}
.tcard{width:100%;max-width:460px;display:flex;flex-direction:column;margin-top:38px;}
.poster{background:var(--paper);border-radius:14px;padding:14px 18px 16px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;}
.poster h1{font-family:var(--f-disp);font-weight:400;margin:0;line-height:1.04;color:var(--ink);font-size:clamp(44px,13.5vw,68px);}
.poster h1 .s{display:block;font-size:.46em;letter-spacing:.08em;color:var(--tartan);margin-bottom:2px;}
.poster h1 .u{background:linear-gradient(transparent 64%, var(--signal) 64% 90%, transparent 90%);padding-right:4px;}
.lead{margin:0;font-size:15px;font-weight:800;color:var(--ink);}
.lineup-h{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);padding-top:10px;font-size:11px;letter-spacing:.14em;color:var(--ink2);}
.lineup-h b{font-family:var(--f-num);font-size:16px;letter-spacing:.04em;color:var(--ink);}
.lineup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 6px;}
.lineup figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;white-space:nowrap;color:var(--ink2);text-align:center;line-height:1.15;min-width:0;}
.lineup canvas{width:100%;max-width:min(40px, 5.6vh);height:auto;aspect-ratio:1;}
.steps{display:flex;flex-direction:column;gap:4px;}
.steps div{display:flex;align-items:center;gap:10px;background:#F1ECE0;border-radius:10px;padding:5px 12px;font-size:13px;line-height:1.45;}
.steps .ph{display:inline-block;}
.steps b{flex:0 0 auto;width:14px;text-align:center;font-family:var(--f-num);font-size:22px;color:var(--tartan);line-height:1;}
.steps .tx{min-width:0;}
.btn.big{font-size:20px;padding:13px;}

/* 描く画面 */
#draw{justify-content:flex-start;background:#d6e6edf0;}
.board{width:100%;max-width:760px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:8px;}
.bar-info{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--paper);border-radius:12px;padding:6px 14px;}
.bar-info .lbl{font-size:11px;letter-spacing:.12em;opacity:.75;}
.bar-info .h{font-family:var(--f-num);font-weight:800;font-size:30px;line-height:1;color:var(--signal);font-variant-numeric:tabular-nums;}
.tries{display:flex;gap:6px;align-items:center;}
.tries i{width:14px;height:14px;border-radius:50%;border:2px solid var(--paper);display:block;box-sizing:border-box;}
.tries i.x{background:var(--ng);border-color:var(--ng);}
.tries i.now{background:var(--paper);}
.cards{display:flex;gap:8px;}
.icard{flex:1 1 0;min-width:0;background:var(--paper);border-radius:12px;padding:6px 10px;display:flex;gap:10px;align-items:center;border:0;text-align:left;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);}
.icard canvas{width:48px;height:48px;flex:0 0 auto;}
.icard .nm{font-family:var(--f-disp);font-size:20px;line-height:1.2;}
.icard .ey{font-size:11px;letter-spacing:.1em;color:var(--ink2);}
.icard .ht{font-size:12px;color:var(--ink2);line-height:1.4;}
.icard.sel{box-shadow:inset 0 0 0 3px var(--tartan);}
.icard.pick{cursor:pointer;}
.cards.many{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;}
.cards.many .icard{flex-direction:column;text-align:center;padding:4px 2px;gap:0;}
.cards.many .icard canvas{width:34px;height:34px;}
.cards.many .icard .ey{display:none;}
.cards.many .icard .ht{display:none;}
.cards.many .icard .nm{font-size:10px;font-family:var(--f-body);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.cards.two .icard .ht{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pad-wrap{flex:1 1 auto;min-height:200px;background:var(--paper);border-radius:14px;padding:8px 10px 10px;box-shadow:0 2px 0 #0002;display:flex;flex-direction:column;gap:6px;}
.pad-head{height:24px;flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);gap:8px;}
.pad-head b{color:var(--ink);font-weight:800;}
#padBox{position:relative;flex:1 1 auto;min-height:0;}
#formChip{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:8px;padding:4px 10px;font-size:12px;line-height:1.4;}
#formChip b{font-family:var(--f-disp);font-weight:400;font-size:15px;color:var(--signal);}
#formChip{display:flex;align-items:center;height:42px;box-sizing:border-box;overflow:hidden;font-size:11.5px;line-height:1.45;padding:3px 10px;flex:0 0 auto;}
#formChip b{margin-right:6px;font-size:14px;}
#formChip.empty{background:#EDE7DA;color:var(--ink2);}
#formChip.empty{display:flex;align-items:center;}
#formChip .sen{display:inline-block;}
/* 形の名前は縦まん中、説明は名前の右で折り返す */
#formChip b{flex:0 0 auto;align-self:center;}
#formChip .desc{flex:1 1 0;min-width:0;}
#formChip:not(.empty){flex-wrap:nowrap;}
#formChip.warn{background:#F6E1DA;color:var(--ng);font-weight:800;}
.pad-head > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.sheet .fm{font-size:11px;color:var(--ink2);margin-left:4px;}
#pad{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:8px;display:block;cursor:crosshair;}
#stats{line-height:1;white-space:nowrap;font-family:var(--f-num);font-size:18px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.row{display:flex;gap:10px;}
.row .btn{flex:1 1 0;}

/* 跳ぶとき */
#hud{pointer-events:none;justify-content:space-between;}
.hud-top{max-width:100%;flex-wrap:wrap;display:flex;gap:8px;align-items:center;background:#1d2433d9;color:var(--paper);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:800;}
.hud-top .h{font-family:var(--f-num);font-size:22px;color:var(--signal);}
.hud-top .barlbl{display:inline-flex;align-items:center;gap:4px;}
.hud-top .h{line-height:1;}
.meter{align-self:flex-start;background:#1d2433d9;color:var(--paper);border-radius:10px;padding:6px 12px;display:flex;gap:14px;align-items:baseline;}
.meter .k{font-size:11px;opacity:.7;letter-spacing:.08em;}
.meter .v{font-family:var(--f-num);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;}
#res{position:absolute;left:50%;bottom:max(16px, env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,460px);background:var(--paper);border-radius:16px;padding:16px 18px;box-sizing:border-box;box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;gap:8px;animation:pop .35s cubic-bezier(.2,1.6,.4,1);}
@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#res .big{font-family:var(--f-disp);font-size:30px;line-height:1.2;}
#res .big.ok{color:var(--ok);} #res .big.ng{color:var(--ng);}
#res .sub{font-size:14px;color:var(--ink2);margin-top:-4px;}
#res .nums{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;font-size:12px;color:var(--ink2);}
#res .nums span{display:inline-flex;align-items:baseline;}
#res .nums b.jp{font-family:var(--f-body);font-size:17px;line-height:1;}
#res .nums b{font-family:var(--f-num);font-size:20px;color:var(--ink);font-weight:800;margin-left:4px;}
#res .miracle{background:var(--signal);font-weight:800;font-size:13px;padding:2px 8px;border-radius:4px;align-self:flex-start;}

/* 記録 */
#end{justify-content:center;background:#cfe3ecc0;overflow-y:auto;}
.sheet{width:100%;max-width:440px;background:var(--paper);border-radius:6px;padding:20px 20px 18px;box-sizing:border-box;box-shadow:0 8px 0 #0002;display:flex;flex-direction:column;gap:12px;}
.sheet .ey{font-size:12px;letter-spacing:.2em;color:var(--ink2);}
.sheet .rec{font-family:var(--f-num);font-weight:800;font-size:64px;line-height:.9;}
.sheet .rec small{font-size:24px;margin-left:4px;}
.sheet .with{font-size:15px;font-weight:800;}
.sheet table{width:100%;border-collapse:collapse;font-size:14px;}
.sheet td{padding:5px 4px;vertical-align:middle;}
.sheet tr:nth-child(odd) td{background:#F3EEE3;}
.sheet tr td:first-child{border-radius:8px 0 0 8px;} .sheet tr td:last-child{border-radius:0 8px 8px 0;}
.sheet td.it{display:flex;align-items:center;gap:6px;}
.sheet td.it canvas{width:24px;height:24px;flex:0 0 auto;}
.mark{width:22px;height:22px;display:block;margin-left:auto;}
.sheet td.n{font-family:var(--f-num);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;}
.sheet td.mk{width:30px;}
.tbl{max-height:38vh;overflow-y:auto;}

/* 共有 */
.share{display:flex;gap:10px;}
.share .btn{flex:1 1 0;padding:12px 10px;font-size:15px;}
.btn.x{background:#000;}
#shot{position:absolute;inset:0;z-index:40;background:#1d2433e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;box-sizing:border-box;}
#shot[hidden]{display:none;}
#shot img{width:100%;max-width:600px;border-radius:6px;box-shadow:0 6px 24px #0006;}
#shot p{margin:0;color:var(--paper);font-size:14px;font-weight:800;text-align:center;}
#shot .row{width:100%;max-width:600px;}

/* 音の切りかえ */
#snd{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:30;min-width:40px;height:40px;padding:0 9px;border-radius:10px;border:0;background:#1d2433b0;color:var(--paper);font-size:12px;font-weight:800;letter-spacing:.04em;line-height:1.05;}
#snd b{display:block;font-family:var(--f-num);font-size:13px;}
#snd.off{opacity:.62;}
@media (prefers-reduced-motion: reduce){ #res{animation:none;} }
</style>
</head>
<body>

<div id="app">
  <canvas id="scene"></canvas>

  <section id="title" class="screen">
    <div class="tcard">
      <div class="poster">
        <h1><span class="s">なんでも</span><span class="u">棒高跳び</span></h1>
        <p class="lead">竿は選べない。形だけ、描ける。</p>
        <div class="lineup-h"><span>竿の種類（このうち1つが配られます）</span><b id="nItems">12種</b></div>
        <div class="lineup" id="lineup"></div>
        <div class="steps">
          <div><b>1</b><span class="tx"><span class="ph">竿が1つ</span><span class="ph">配られる</span></span></div>
          <div><b>2</b><span class="tx"><span class="ph">指で</span><span class="ph">形を描く。</span><span class="ph">形と長さで</span><span class="ph">跳び方が</span><span class="ph">変わる</span></span></div>
          <div><b>3</b><span class="tx"><span class="ph">1つの</span><span class="ph">高さに</span><span class="ph">3回まで。</span><span class="ph">跳べたら</span><span class="ph">バーが</span><span class="ph">上がる</span></span></div>
        </div>
        <button class="btn go big" id="bStart">スタート</button>
      </div>
    </div>
  </section>

  <section id="draw" class="screen" hidden>
    <div class="board">
      <div class="bar-info">
        <div><div class="lbl">バーの高さ</div><div class="h" id="dBar">2m00</div></div>
        <div style="text-align:right"><div class="lbl" id="dTryLbl">1回目</div><div class="tries" id="dTries"></div></div>
      </div>
      <div class="cards" id="cards"></div>
      <div class="pad-wrap">
        <div class="pad-head"><span><b id="padItem">ものさし</b> の形を描く</span><span id="stats"></span></div>
        <div id="formChip"></div><div id="padBox"><canvas id="pad"></canvas></div>
      </div>
      <div class="row">
        <button class="btn sub" id="bClear">描き直す</button>
        <button class="btn go" id="bJump" disabled>跳ぶ</button>
      </div>
    </div>
  </section>

  <section id="hud" class="screen" hidden>
    <div class="hud-top"><span id="hItem">ものさし</span><span class="barlbl">バー<span class="h" id="hBar">2m00</span></span><span id="hTry">1回目</span></div>
    <div class="meter"><div><div class="k">いまの高さ</div><div class="v" id="hNow">0.00</div></div><div><div class="k">最高</div><div class="v" id="hPeak">0.00</div></div></div>
  </section>
  <div id="res" hidden></div>

  <section id="end" class="screen" hidden>
    <div class="sheet">
      <div class="ey">今回の記録</div>
      <div class="rec" id="eRec">—</div>
      <div class="with" id="eWith"></div>
      <div class="tbl"><table id="eTbl"></table></div>
      <div class="share">
        <button class="btn sub" id="bShare">画像を共有</button>
        <button class="btn x" id="bPost">Xにポスト</button>
      </div>
      <div class="row">
        <button class="btn sub" id="bTitle">タイトルへ</button>
        <button class="btn go" id="bAgain">もう一度</button>
      </div>
    </div>
  </section>

  <div id="shot" hidden><img id="shotImg" alt="記録の画像"><p>画像を長押し（右クリック）して保存できます</p><div class="row"><a class="btn sub" id="shotDl" download="nandemo-polevault.png" style="text-align:center;text-decoration:none">ダウンロード</a><button class="btn" id="shotClose">閉じる</button></div></div>
  <button id="snd" aria-label="音の切りかえ">音<b>ON</b></button>
</div>

<script>
// ===== 物理（なんでも棒高跳び） =====
const G = 9.8;
const ITEMS = {
  monosashi:{ id:'monosashi',name:'ものさし', hint:'よくしなる。長すぎ・曲げすぎると折れる', K:18,  rigid:0.05, brk:0.32, dens:0.35 },
  sao:     { id:'sao',     name:'物干し竿',   hint:'長くて硬い。しならない',               K:150, rigid:0.35, brk:0.60, dens:1.30 },
  kasa:    { id:'kasa',    name:'傘',         hint:'硬め。いちばん上でひらく',             K:80,  rigid:0.25, brk:0.30, dens:0.60, special:'kasa' },
  straw:   { id:'straw',   name:'ストロー',   hint:'やわらかい。たぶん無理',               K:6,   rigid:0.00, brk:0.13, dens:0.50, special:'miracle' },
  take:    { id:'take',    name:'竹',         hint:'よくしなって、強い。いちばんまとも',   K:26,  rigid:0.03, brk:0.38, dens:0.45 },
  tsuri:   { id:'tsuri',   name:'釣り竿',     hint:'とてもしなる。めったに折れない',       K:9,   rigid:0.00, brk:0.55, dens:0.20 },
  houki:   { id:'houki',   name:'ほうき',     hint:'硬め。先がつっかえる',                 K:55,  rigid:0.45, brk:0.32, dens:0.80 },
  hose:    { id:'hose',    name:'ホース',     hint:'ぐにゃぐにゃ。折れないけれど…',       K:2.5, rigid:0.00, brk:9.00, dens:0.90 },
  enpitsu: { id:'enpitsu', name:'えんぴつ',   hint:'硬いけれど、ぽきっと折れる',           K:45,  rigid:0.20, brk:0.14, dens:0.40 },
  ami:     { id:'ami',     name:'虫取り網',   hint:'細くて硬め。先に網',                   K:70,  rigid:0.30, brk:0.22, dens:0.35 },
  magonote:{ id:'magonote',name:'孫の手',     hint:'軽くて硬め。背中もかける',             K:65,  rigid:0.30, brk:0.30, dens:0.25 },
  tsuppari:{ id:'tsuppari',name:'つっぱり棒', hint:'ぐっと縮む。伸び縮みするので折れない', K:13,  rigid:0.30, brk:9.00, dens:0.60 },
};
const ITEM_IDS = Object.keys(ITEMS);

// 形の種類
const FORMS = {
  straight: { name:'まっすぐ', desc:'ふつうに跳ぶ' },
  bow:      { name:'弓なり',   desc:'しなりやすい。硬い竿でも戻されにくい' },
  spring:   { name:'ばね',     desc:'ばねのように縮んで、上で弾む。折れにくい' },
  hook:     { name:'かぎ',     desc:'曲げた端に手をかけて、高い所を持てる。助走は遅くなる' },
};

// 竿の向き：pts[0] を先（ボックスに突き立てる側）、最後を手で持つ側にそろえる。
// 縦長に描いた竿は下の端を手で持つ（描いたとおり手から上へ伸びる）。横長なら左の端を持ち、右の端が先
function orientStroke(pts){
  if(!pts || pts.length < 2) return pts;
  const a = pts[0], z = pts[pts.length-1];
  const tall = Math.abs(a.y-z.y) >= Math.abs(a.x-z.x) * 0.6 && Math.abs(a.y-z.y) > 0.3;
  const tipFirst = tall ? a.y > z.y : a.x > z.x;
  return tipFirst ? pts : pts.slice().reverse();
}

function poleParams(item, st, opt){
  opt = opt || {};

const BAR_X = 0.7; // ボックスの奥の端からバーまで（規則では 0.4〜0.8m）。支柱がマットの横に立つ位置

// バーの高さに対する判定
function judge(sim, bar){
  if(sim.result==='break') return { ok:false, kind:'break' };
  if(sim.result==='back') return { ok:false, kind:'back' };
  if(sim.result==='short') return { ok:false, kind:'short' };
  if(sim.result==='over') return { ok:false, kind:'over' };

  if(sim.atBar >= bar - 0.45) return { ok:false, kind:'hit' };

  const hangs = A.itemId==='kasa' && f.open && A.sim.result!=='break';
  if(f.phase !== 'pole' && f.phase !== 'back' && !hangs){
    // 体が目に見えてマット（地面）についた瞬間から、頭を支点に脚と体が重さで落ちる
    if(A.touchI == null){
      A.touchI = fr.length-1;
      for(let j=1;j<fr.length;j++){ const q = fr[j]; if(q.phase==='pole'||q.phase==='back') continue;
        if(fr[j-1].y > q.y && basePose(A, j).lifted){ A.touchI = j; break; } }
    }
    if(i >= A.touchI){
      const B = basePose(A, A.touchI);
      if(A.settle == null) A.settle = findSettle(B.x, B.y, B.beta, B.mir);
      const S = A.settle;
      const ts = Math.max(0, (t - A.T) - A.touchI/60);
      const at = u => { const p = Math.min(1, u/0.2), e = Math.pow(p, 1.6);   // 重さで、すぐ・だんだん速く倒れる
        const b2 = B.beta + S.d*e, R = bodyRel(b2, B.mir, 0);
        // マットの端にかかったときの、乗り上げ・ずり落ち（横は勢いのまま、縦は重さで）
        const pm = Math.min(1, u/0.3), ex = 1 - Math.pow(1 - pm, 2), ey = pm*pm;
        const sx = S.px - R[S.pj].x + S.sx*ex; let sy = S.py - R[S.pj].y + S.sy*ey;
        let mn = Infinity; for(const k in R) mn = Math.min(mn, sy + R[k].y - groundAt(sx + R[k].x)); if(mn < 0.04) sy += 0.04 - mn; // 倒れる途中も地面・マットにめりこまない
        return { x:sx, y:sy, b2 }; };
      const now = at(ts);
      // 支えが急になくなっても（マットの端から外れたときなど）、自由落下より速くは下がらない
      let y = now.y; for(let k=1; k<=40 && k/60<=ts; k++){ const q = at(ts - k/60); y = Math.max(y, q.y - 0.5*9.8*(k/60)*(k/60)); }
      return { x: now.x, y, beta:now.b2, mir:B.mir, tuck:0, run:false, phase:f.phase, f, i };
    }
  }
  return basePose(A, i);
}
// めりこみの押し出し。mode：'top'（マットの上に乗る）／'left'（マットの手前の側面で押し返す）／'right'（奥の側面）／null（地面だけ）
function resolveBody(x, y, R, mode){
  let mn = Infinity; for(const k in R) mn = Math.min(mn, R[k].y);
  y = Math.max(y, 0.04 - mn);
  if(mode === 'top'){ let need = -Infinity; for(const k in R){ const jx = x + R[k].x; if(jx > MAT_X0 && jx < MAT_X1) need = Math.max(need, MAT_H + 0.04 - R[k].y); } if(need > y) y = need; }
  else if(mode === 'left' || mode === 'right'){ let d = 0;
    for(const k in R){ const jx = x + R[k].x, jy = y + R[k].y; if(jy >= MAT_H + 0.02 || jx <= MAT_X0 - 0.03 || jx >= MAT_X1 + 0.03) continue;
      if(mode === 'left') d = Math.min(d, MAT_X0 - 0.03 - jx); else d = Math.max(d, MAT_X1 + 0.03 - jx); }
    x += d; }
  return { x, y };
}
// 最初にマットに触れる瞬間を探して、上・手前・奥のどれで触れるかを決める
function contactMode(A){
  const fr = A.sim.frames;
  for(let j=0;j<fr.length;j++){ if(fr[j].phase==='pole'||fr[j].phase==='back') continue;
    const P = basePose(A, j, true), R = bodyRel(P.beta, P.mir, 0);
    let up = 0, l = 0, rr = 0, hit = false;
    for(const k in R){ const jx = P.x + R[k].x, jy = P.y + R[k].y; if(jx <= MAT_X0 || jx >= MAT_X1 || jy >= MAT_H + 0.04) continue;
      hit = true; up = Math.max(up, MAT_H + 0.04 - jy); l = Math.max(l, jx - (MAT_X0 - 0.03)); rr = Math.max(rr, MAT_X1 + 0.03 - jx); }
    if(hit) return up <= l && up <= rr ? 'top' : (l <= rr ? 'left' : 'right');
  }
  return 'top';
}
// i 番目の瞬間の、ふつうの姿勢（着地で脚が落ちる前）
function basePose(A, i, raw){
  const fr = A.sim.frames, f = fr[i];
  const th0 = A.sim.th0;
  let beta, mir = 1;
  if(f.phase==='pole'||f.phase==='back') beta = Math.PI*0.95*Math.min(1,Math.max(0,1 - f.th/th0));
  else {
    const rel = fr.findIndex(q=>q.phase!=='pole'&&q.phase!=='back');
    const dt = Math.max(0,(i-rel)/60);
    const b0 = rel>0 ? Math.PI*0.95*Math.min(1,Math.max(0,1 - fr[rel-1].th/th0)) : 0.3;
    if(A.sim.result==='break') beta = b0 + dt*2.0;
    else if(A.sim.result==='back') beta = b0*Math.max(0, 1 - dt/0.3);   // 戻されたら、ぶら下がった向きのまま足から降りる
    else {
      // バーを越えるまでは逆立ちに近い姿勢（体が手より上）、越えてから体を寝かせる
      if(A.passI == null){ A.passI = fr.findIndex((q,j)=> j>=rel && q.x >= BAR_X + 0.45); if(A.passI < 0) A.passI = fr.length; }
      const toTop = b0 + (Math.PI - b0)*Math.min(1, dt/0.25);
      const after = Math.max(0, (i - A.passI)/60);
      beta = i < A.passI ? toTop : Math.PI - (Math.PI*0.45)*Math.min(1, after/0.4); // 脚を前（マット側）へ送って倒れる
      // 竿を離した瞬間の向きから、なめらかにつなぐ（離すのがバーを越えたあとでも、1コマで向きが飛ばないように）
      if(dt < 0.2){ const w = dt/0.2, sm = w*w*(3-2*w); beta = b0 + (beta - b0)*sm; }
    }
    if(A.itemId==='kasa' && f.open){
      // 傘が開いたら、傘にぶら下がる向きへ（開いた瞬間から0.3秒かけてつなぐ）
      if(A.openI == null){ A.openI = fr.findIndex(q=>q.open); }
      const w = Math.min(1, Math.max(0, (i - A.openI)/18)), sm = w*w*(3-2*w);
      beta = beta + (Math.max(0, b0 - dt*2.5) - beta)*sm; mir = 1; }
  }
  let x = f.x, y = f.y, lifted = false;
  if(f.phase!=='pole' && f.phase!=='back'){
    if(A.sim.result!=='back' && !(A.itemId==='kasa' && f.open && A.sim.result!=='break') && (f.phase==='land' || f.phase==='fall' || (f.phase==='fly' && i>0 && fr[i-1].y > f.y))){
      // 落ちてくるあいだに、体を横向き（あおむけ）にそろえる
      const land = fr.length-1, left = Math.max(0, (land - i)/60);
      // 寝かせる向き（あおむけ／うつぶせ）は、着地の瞬間の姿勢で1回だけ決める（途中で入れかわって一瞬くるっと回らないように）
      if(A.lieT == null){ const rel = fr.findIndex(q=>q.phase!=='pole'&&q.phase!=='back'); const b0 = rel>0 ? Math.PI*0.95*Math.min(1,Math.max(0,1 - fr[rel-1].th/th0)) : 0.3;
        A.lieT = (A.sim.result==='break' && b0 + Math.max(0,(land-rel)/60)*2.0 >= Math.PI) ? Math.PI*1.5 : Math.PI*0.5; }
      const relI = fr.findIndex(q=>q.phase!=='pole'&&q.phase!=='back'), since = Math.min(1, Math.max(0, (i - relI)/60/0.25)), ramp = since*since*(3-2*since);
      const target = A.lieT; const k = Math.min(1, Math.max(0, 1 - left/0.45))*ramp;   // 竿を離した直後から急に回らない
      beta = beta + (target - beta)*k;
    }
    // 地面とマットにめりこまないように体を押し出す。マットに上から触れたら上に乗せ、横から触れたら側面で押し返す。
    // どちらで触れるかは、最初に触れた瞬間に「押し出す量が小さいほう」で決め、その回のあいだは変えない（急に位置が飛ばないように）
    const R = bodyRel(beta, mir, 0);
    if(raw !== true){ if(A.cmode === undefined) A.cmode = contactMode(A); }
    const r = resolveBody(x, y, R, raw === true ? null : A.cmode);
    if(r.x !== x || r.y !== y) lifted = true;
    x = r.x; y = r.y;
  }
  const tuck = (f.phase==='pole'||f.phase==='back') ? Math.max(0, Math.sin(beta)) : 0;
  return { x, y, beta, mir, tuck, lifted, run:false, phase:f.phase, f, i };
}

function W2S(x,y){ return [ VW/2 + (x - scene.camX)*scene.scale, scene.groundY - y*scene.scale ]; }
// 奥行き。カメラは真横より少し手前の上にあり、奥（z>0）にあるものほど右上に見える。走る人・竿・バーの当たりは z=0 の面
let VIEW = 'oblique'; const DZX = 0.13, DZY = 0.1;
function W2Sz(x,y,z){ return VIEW==='oblique' ? W2S(x + z*DZX, y + z*DZY) : W2S(x,y); }

function drawBackground(){
  const s = scene.scale;
  const g = ctx.createLinearGradient(0,0,0,scene.groundY); g.addColorStop(0,'#A9CCE0'); g.addColorStop(1,'#EAF2F2');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // スタンド（遠く、ゆっくり流れる）
  const par = 0.35, sx = -scene.camX*s*par;
  const standTop = scene.groundY - 3.4*s*0.9;
  ctx.fillStyle='#8BA4B5'; ctx.fillRect(0, standTop, VW, scene.groundY-standTop);
  ctx.fillStyle='#7690A3';
  for(let r=0;r<5;r++){ const y = standTop + r*(scene.groundY-standTop)/5; ctx.fillRect(0,y,VW,Math.max(1,s*0.05)); }
  // 観客の点
  const cell = Math.max(6, s*0.28);
  for(let r=0;r<5;r++){ const y = standTop + (r+0.5)*(scene.groundY-standTop)/5;
    for(let k=-1;k<VW/cell+1;k++){ const wx = k + Math.floor(-sx/cell); const xx = ((wx*cell + sx) % (VW+cell*2)); const h = (Math.sin(wx*12.9898+r*78.233)*43758.5453)%1;
      if(Math.abs(h)<0.55){ ctx.fillStyle = ['#C9D6DE','#E6CFA8','#B7C9A8','#D9B3A8'][Math.abs(Math.floor(h*40))%4]; ctx.beginPath(); ctx.arc(wx*cell+sx, y, cell*0.22, 0, Math.PI*2); ctx.fill(); } } }
  // 地面
  ctx.fillStyle='#7FB069'; ctx.fillRect(0, scene.groundY, VW, VH-scene.groundY);
  if(VIEW==='oblique'){ drawGroundDepth(); return; }
  const [x0] = W2S(-80,0), [x1] = W2S(MAT_X0,0);
  ctx.fillStyle='#C4553A'; ctx.fillRect(x0, scene.groundY, x1-x0, Math.max(6, 0.25*s));
  ctx.fillStyle='#FBF8F1'; ctx.fillRect(x0, scene.groundY+Math.max(6,0.25*s)-2, x1-x0, 2);
  // 距離の目印
  ctx.fillStyle='#FBF8F1'; ctx.font=`600 ${Math.max(10,s*0.22)}px 'Barlow Condensed',sans-serif`; ctx.textAlign='center';
  for(let m=-60;m<0;m+=5){ const [mx] = W2S(m,0); if(mx<-20||mx>VW+20) continue; ctx.fillRect(mx-1, scene.groundY, 2, Math.max(6,0.25*s)); ctx.fillText(`${-m}m`, mx, scene.groundY+Math.max(6,0.25*s)+Math.max(10,s*0.22)); }
  ctx.textAlign='left';
}
// 奥行きのある地面：奥の看板の壁 → 奥の芝 → 助走路（上の面。両側に白線、5mごとの線は奥へ斜めにのびる）→ 手前の芝
const RW = 1.5, WALL_Z = 7;
function drawGroundDepth(){
  const s = scene.scale, gy = scene.groundY;
  const wy = W2Sz(0,0,WALL_Z)[1];
  ctx.fillStyle='#74A55F'; ctx.fillRect(0, wy, VW, gy-wy+1);
  ctx.fillStyle='#5E6E80'; ctx.fillRect(0, wy - Math.max(6,0.28*s), VW, Math.max(6,0.28*s));
  ctx.fillStyle='#7FB069'; ctx.fillRect(0, gy, VW, VH-gy);
  const poly=(pts,col)=>{ ctx.fillStyle=col; ctx.beginPath(); pts.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath(); ctx.fill(); };
  poly([W2Sz(-80,0,-RW),W2Sz(MAT_X0,0,-RW),W2Sz(MAT_X0,0,RW),W2Sz(-80,0,RW)], '#C4553A');
  const line=(a,b,w,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); };
  line(W2Sz(-80,0,-RW),W2Sz(MAT_X0,0,-RW),2,'#FBF8F1'); line(W2Sz(-80,0,RW),W2Sz(MAT_X0,0,RW),1.5,'#FBF8F1cc');
  // ボックス：助走路のまん中に掘った溝（上から見た形）
  const bw = 0.4; poly([W2Sz(-1.0,0,-bw*0.3),W2Sz(0,0,-bw),W2Sz(0,0,bw),W2Sz(-1.0,0,bw*0.3)], '#3C4A5C');
  ctx.fillStyle='#FBF8F1'; ctx.font=`600 ${Math.max(10,s*0.22)}px 'Barlow Condensed',sans-serif`; ctx.textAlign='center';
  for(let m=-60;m<0;m+=5){ const a = W2Sz(m,0,-RW), b = W2Sz(m,0,RW); if(a[0]<-40||a[0]>VW+40) continue;
    line(a,b,2,'#FBF8F1'); ctx.fillText(`${-m}m`, a[0], a[1]+Math.max(12,s*0.3)); }
  ctx.textAlign='left';
}
// 体の影（体の真下、z=0 の地面かマットの上）。高いほど薄く小さく
function drawShadow(x, y){
  if(VIEW!=='oblique') return;
  const s = scene.scale, g = groundAt(x), h = Math.max(0, y - g), k = Math.max(0.25, 1 - h/6);
  const [sx,sy] = W2Sz(x, g, 0); ctx.fillStyle=`rgba(29,36,51,${0.22*k})`; ctx.beginPath(); ctx.ellipse(sx, sy, 0.45*s*k, 0.09*s*k, 0, 0, Math.PI*2); ctx.fill();
}
const MAT_HALF = 2.0;   // マットの幅の半分（m）。支柱（z=±2.25）はマットの横に立つ
function drawMatBox(){
  const s = scene.scale;
    const Z0=-MAT_HALF, Z1=MAT_HALF, P=(x,y,z)=>W2Sz(x,y,z);
    const poly=(pts,col)=>{ ctx.fillStyle=col; ctx.beginPath(); pts.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.closePath(); ctx.fill(); };
    poly([P(MAT_X1,0,Z0),P(MAT_X1,0,Z1),P(MAT_X1,MAT_H,Z1),P(MAT_X1,MAT_H,Z0)], '#244C88');                 // 右の面
    poly([P(MAT_X0,MAT_H,Z0),P(MAT_X1,MAT_H,Z0),P(MAT_X1,MAT_H,Z1),P(MAT_X0,MAT_H,Z1)], '#3F70BA');         // 上の面
    const [mx0,my] = P(MAT_X0,MAT_H,Z0), [mx1] = P(MAT_X1,0,Z0);
    ctx.fillStyle='#2E5FA8'; ctx.fillRect(mx0, my, mx1-mx0, MAT_H*s);                                        // 手前の面
    ctx.fillStyle='#244C88'; ctx.fillRect(mx0, my+MAT_H*s*0.55, mx1-mx0, MAT_H*s*0.12);
    ctx.fillStyle='#4A7CC4'; ctx.fillRect(mx0, my, mx1-mx0, Math.max(2,s*0.06));
}
function drawPit(bar, barFall){
  const s = scene.scale;
  // ボックス（真横のときだけ。奥行きのときは地面と一緒に描く）
  if(VIEW!=='oblique'){ const [bx, by] = W2S(0,0); ctx.fillStyle='#3C4A5C'; ctx.beginPath(); ctx.moveTo(bx-0.5*s,by); ctx.lineTo(bx,by+0.2*s); ctx.lineTo(bx+0.06*s,by); ctx.fill(); }
  // マット
  if(VIEW==='oblique'){
    drawStand(bar, barFall, +1, 'post');   // 奥の支柱はマットの向こう側
    drawMatBox();
  } else {
  const [mx0,my] = W2S(MAT_X0, MAT_H), [mx1] = W2S(MAT_X1,0);
  ctx.fillStyle='#2E5FA8'; ctx.fillRect(mx0, my, mx1-mx0, MAT_H*s);
  ctx.fillStyle='#244C88'; ctx.fillRect(mx0, my+MAT_H*s*0.55, mx1-mx0, MAT_H*s*0.12);
  ctx.fillStyle='#4A7CC4'; ctx.fillRect(mx0, my, mx1-mx0, Math.max(2,s*0.06));
  }
  if(VIEW==='oblique') drawStand(bar, barFall, +1, 'bar');   // バーの奥の半分（体より後ろ）
}
// 支柱とバー。バーの長さ 4.5m、支柱は z=±2.25。side=+1 は奥の支柱とバーの奥半分、-1 は手前の支柱とバーの手前半分
const BAR_HALF = 2.25;
function drawStand(bar, fall, side, part){
  const s = scene.scale, z = side*BAR_HALF, w = Math.max(3, s*(side>0 ? 0.08 : 0.1));
  const [px,py] = W2Sz(BAR_X, 0, z), [,pt] = W2Sz(BAR_X, bar+0.45, z);
  if(part !== 'bar'){
  ctx.fillStyle = side>0 ? '#6F7C91' : '#8A97AB'; ctx.fillRect(px-w/2, pt, w, py-pt);
  ctx.fillStyle='#1D2433'; ctx.fillRect(px-Math.max(4,s*0.12), py-Math.max(3,s*0.05), Math.max(8,s*0.24), Math.max(3,s*0.05));
  }
  if(part === 'post') return;
  // バー：落ちるときは両端がマット側へずれながら下がる
  const endY = bar - fall*(bar-MAT_H-0.05), endX = BAR_X + fall*0.5;
  const [cx,cy] = W2Sz(endX, endY, 0), [ex,ey] = W2Sz(endX, endY, z);
  ctx.lineCap='butt'; ctx.lineWidth=Math.max(3,s*0.07);
  const n=4; for(let k=0;k<n;k++){ ctx.strokeStyle = (k+(side>0?0:1))%2?'#1D2433':'#F2C230'; ctx.beginPath();
    ctx.moveTo(cx+(ex-cx)*k/n, cy+(ey-cy)*k/n); ctx.lineTo(cx+(ex-cx)*(k+1)/n, cy+(ey-cy)*(k+1)/n); ctx.stroke(); }
  ctx.fillStyle='#5E6B80'; ctx.fillRect(px-w*0.2-(side>0?0:w*0.6), W2Sz(BAR_X,bar,z)[1]+Math.max(2,s*0.04), w*0.9, Math.max(3,s*0.05));
}
// 真横から見た支柱とバー。奥の支柱は手前の支柱に重なって見えない。バーは奥へのびる棒なので、手前の端（丸）だけが見える
function drawPostFront(bar, fall=0){
  if(VIEW==='oblique') return drawStand(bar, fall, -1);
  const s = scene.scale, w = Math.max(4,s*0.1);
  const [px,py] = W2S(BAR_X, 0), [,pt] = W2S(0, bar+0.45); ctx.fillStyle='#8A97AB'; ctx.fillRect(px-w/2, pt, w, py-pt);
  ctx.fillStyle='#1D2433'; ctx.fillRect(px-Math.max(5,s*0.14), py-Math.max(3,s*0.06), Math.max(10,s*0.28), Math.max(3,s*0.06));
  const [,ky] = W2S(0, bar); ctx.fillStyle='#5E6B80'; ctx.fillRect(px - w*0.9, ky + Math.max(7, s*0.15), w*1.8, Math.max(3, s*0.05));
  const [bx,by] = W2S(BAR_X + fall*0.5, bar - fall*(bar-MAT_H-0.05)), r = Math.max(7, s*0.15);
  ctx.fillStyle='#F2C230'; ctx.strokeStyle='#1D2433'; ctx.lineWidth=Math.max(1.5, r*0.16); ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle='#1D2433'; ctx.lineWidth=Math.max(2, r*0.32); ctx.beginPath(); ctx.arc(bx, by, r*0.62, 0, Math.PI*2); ctx.stroke();
}

// 持って走るときの向き。描いたままで地面にもぐらなければそのまま。
// もぐるときだけ、形は変えずに手を軸に回して、先を前へ起こす（いちばん小さい回し方）
function carryPose(st){
  const P0 = st.pts, hand = P0[st.handIdx], HAND_Y = 1.25;
  const rel = P0.map(p=>({x:p.x-hand.x, y:p.y-hand.y}));
  const ok = a => { const c = Math.cos(a), s = Math.sin(a); let tipX = 0;
    for(let i=0;i<rel.length;i++){ const x = rel[i].x*c - rel[i].y*s, y = rel[i].x*s + rel[i].y*c;
      if(HAND_Y + y < 0.12) return false; if(i===0) tipX = x; }
    return true; };
  let rot = 0;
  if(!ok(0)){
    rot = null;
    for(let d=0.02; d<=Math.PI; d+=0.02){ if(ok(d)){ rot = d; break; } if(ok(-d)){ rot = -d; break; } }
    if(rot === null) rot = 0;
  }
  const c = Math.cos(rot), s = Math.sin(rot);
  return { rot, pts: rel.map(p=>({x:p.x*c - p.y*s, y:p.x*s + p.y*c})) };
}
// 突き立てたあと、竿がバー・支柱・地面にかからないよう、ふくらむ側と大きさを選ぶ
// まず描いたそのままを試し、だめなら走路側へ返す。それでもはみ出すときだけ曲がりを小さくする
function fitPoleShape(st, sim, xp, H0){
  // しなる（押し縮む）ときのふくらみ：描いた曲がりがあればその側、まっすぐなら上（マット側）。実際の棒高跳びと同じ

function setCamera(tx, ty, bar, needH, needW, followX){
  // needH・needW：画面に入れたい高さ・幅（メートル）。竿が大きいときは引いて映す

  const viewW = Math.max(7.5, needW || 0);
  const gY = VH - Math.max(60, VH*0.12);
  const target = Math.min((gY - 76)/viewH, VW/viewW);
  const first = scene.camX === null;
  scene.scale = (first || !scene.scale) ? target : scene.scale + (target-scene.scale)*0.1;
  scene.groundY = VH - Math.max(60, VH*0.12);
  if(followX != null){
    // 選手について行きながら、映す位置のずれだけをなめらかに変える（踏み切りで急に動かない）
    const off = tx - followX;
    scene.camOff = (first || scene.camOff == null) ? off : scene.camOff + (off - scene.camOff)*0.1;
    scene.camX = followX + scene.camOff;

      const B = A.brk, low = shape.filter(o=>o.u<=0.5).map(o=>({u:o.u*2,d:o.d*0.5})), up = shape.filter(o=>o.u>=0.5).map(o=>({u:(o.u-0.5)*2,d:o.d*0.5}));
      const lowL = Math.hypot(B.mx, B.my), upL = Math.hypot(B.hx-B.mx, B.hy-B.my);
      // 下半分：ボックスを支点に、後ろ（走路側）へ倒れて地面で止まる
      const a0 = Math.atan2(B.my, B.mx), aEnd = Math.PI - 0.06;
      const kL = Math.min(1, since*since*2.2), aL = a0 + (aEnd - a0)*kL;
      drawHalfPole(polePts({x:0,y:0}, {x:Math.cos(aL)*lowL, y:Math.sin(aL)*lowL}, low, lowL), upL, false, id, 0.03);
      // 上半分：手から離れ、折れ目でつながったまま下半分と一緒に倒れる（折りたたまれるように）
      const Mx = Math.cos(aL)*lowL, My = Math.sin(aL)*lowL;
      const u0 = Math.atan2(B.hy-B.my, B.hx-B.mx), uEnd = aL + 0.35;          // 最後は下半分の先に、少し折れ曲がって重なる
      let du = uEnd - u0; while(du > Math.PI) du -= 2*Math.PI; while(du < -Math.PI) du += 2*Math.PI;
      const kU = Math.min(1, since/0.7), eU = kU*kU*(3-2*kU), aU = u0 + du*eU;
      const top = { x: Mx + Math.cos(aU)*upL, y: Math.max(0.03, My + Math.sin(aU)*upL) };
      drawHalfPole(polePts({x:Mx, y:Math.max(0.03,My)}, top, up, upL), lowL, true, id, null);
    } else if(id==='kasa' && A.sim.result!=='back'){
      // 傘は持ったまま。手を離したら0.3秒で頭の上へ振り上げ、ひらくときは0.3秒で広がる
      const HOLD = Math.PI/2 + 0.25;
      if(A.openI == null){ A.openI = fr.findIndex(q=>q.open); if(A.openI < 0) A.openI = Infinity; }
      const iNow = Math.min(fr.length-1, Math.floor((A.t-A.T)*60));
      if(iNow >= A.openI){
        const k = Math.min(1, (iNow - A.openI)/18), e = k*k*(3-2*k);
        const [sx,sy] = W2S(v.x, v.y);
        drawOpenKasa(ctx, sx, sy, c0*scene.scale, -(HOLD - Math.PI/2)*(1-e), e, Math.max(4, POLE_W.kasa*scene.scale));
      } else {
        const a0 = Math.atan2(-v.y, -v.x);                 // 手を離した瞬間：手から見たボックスの向き
        let d = HOLD - a0; while(d > Math.PI) d -= 2*Math.PI; while(d < -Math.PI) d += 2*Math.PI;
        if(d < 0) d += 2*Math.PI;                           // 前（上）回りで振り上げる
        const k = Math.min(1, since/0.3), e = k*k*(3-2*k), ang = a0 + d*e;
        const lf = fr[Math.max(0,rel-1)], kb = Math.min(1, since/0.35), eb = 1 - Math.pow(1-kb, 3), fRel = A.fCap == null ? fNow : (A.fSign||1)*Math.min(Math.abs(fNow), A.fCap);
        const len = lf.r + (c0 - lf.r)*eb, fBack = fRel + (A.fit.sgn - fRel)*eb;
        const shB = A.st.shape.map(o=>({u:o.u, d:o.d*fBack}));
        drawPoleWorld(polePts({x:v.x+Math.cos(ang)*len,y:v.y+Math.sin(ang)*len}, {x:v.x,y:v.y}, shB, c0, A.fit.xside, A.fit.s + (1 - A.fit.s)*eb), id, null, 'lift');
      }
    } else {
      // 手を離した竿が、後ろへ倒れる
      const lf = fr[Math.max(0,rel-1)];
      const ang0 = Math.atan2(lf.y, lf.x); const fall = Math.min(Math.PI - ang0 - 0.05, since*since*2.2);
      const ang = ang0 + fall;
      // 押し縮められていた竿が、0.35秒かけて元の長さと描いた形へ戻る（一気に伸びない）
      const kb = Math.min(1, since/0.35), eb = 1 - Math.pow(1-kb, 3), fRel = A.fCap == null ? fNow : (A.fSign||1)*Math.min(Math.abs(fNow), A.fCap);
      const len = lf.r + (c0 - lf.r)*eb, fBack = fRel + (A.fit.sgn - fRel)*eb;
      const shB = A.st.shape.map(o=>({u:o.u, d:o.d*fBack}));
      drawPoleWorld(polePts({x:0,y:0}, {x:Math.cos(ang)*len, y:Math.max(0.1,Math.sin(ang)*len)}, shB, c0, A.fit.xside, A.fit.s + (1 - A.fit.s)*eb), id, 0.03, 'lift');
    }
  }
  drawFigure(v.x, v.y, v.beta, v.run, A.t, v.mir, v.tuck);
  drawPostFront(bar, A.barFall);
}

let rafT = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-rafT)/1000); rafT = now;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const A = scene.anim;
  if(A){ stepAnim(A, dt); const v = vaulterAt(A);
    if(v.run){
      // 走るとき：選手と、描いたままの竿がまるごと入るように
      const P0 = A.st.pts, hand = P0[A.st.handIdx];
      let l = -0.8, r = 0.6, top = 0.6;
      A.carry.pts.forEach(p=>{ l = Math.min(l, p.x); r = Math.max(r, p.x); top = Math.max(top, p.y); });
      (A.runPts||[]).forEach(p=>{ l = Math.min(l, p.x); r = Math.max(r, p.x); top = Math.max(top, p.y); });
      const left = v.x + l - 0.6, right = v.x + r + 0.6;
      setCamera((left+right)/2, 0, A.bar, v.y + top + 0.5, right - left, v.x);
    } else setCamera(Math.max(v.x + 1.2, -60), 0, A.bar, 0, 0, v.x);
  } else setCamera(scene.mode==='draw' ? 1.0 : 0.5, 0, G_.bar);
  drawWorld(A);
  if(scene.mode==='title' || scene.mode==='titleDemo'){ /* 見本は上に半透明のタイトルが重なる */ }
  requestAnimationFrame(frame);
}
function stepAnim(A, dt){
  if(A.done) { A.holdT = (A.holdT||0)+dt; A.t += dt; if(A.demo && A.holdT>1.6) startDemo(); return; }
  const prevT = A.t; A.t += dt;
  const ev = A.events, sfx = !A.demo;
  if(A.t < A.T){ if(sfx && Math.floor(A.t*5.5)!==Math.floor(prevT*5.5)) SFX.step(); return; }
  if(!ev.plant){ ev.plant=true; if(sfx) SFX.plant(); }
  const v = vaulterAt(A);
  A.trail.push({x:v.x,y:v.y}); if(v.y>A.peak) A.peak=v.y;
  if(!A.demo){ $('hNow').textContent = v.y.toFixed(2); $('hPeak').textContent = A.peak.toFixed(2); }
  if(v.phase==='fly' && !ev.rel){ ev.rel=true; if(sfx) SFX.release(); }
  if(v.f && v.f.open && !ev.kasa){ ev.kasa=true; if(sfx) SFX.kasa(); }
  if(A.sim.result==='break' && v.phase==='fall' && !ev.snap){ ev.snap=true; if(sfx) SFX.snap(); }
  const jd = A.jd;
  if(jd.kind==='hit' && A.barFall===0 && (A.t - A.T)*60 >= jd.contactI) A.barFall = 0.001;
  if(A.barFall>0 && A.barFall<1) A.barFall = Math.min(1, A.barFall + dt*2.5);
  const fr = A.sim.frames;
  if((A.t-A.T)*60 >= fr.length-1){
    A.done = true;
    if(sfx){ SFX.mat(); setTimeout(()=> jd.ok ? SFX.clear() : SFX.fail(), 180); setTimeout(()=>showResult(A), 650); }
  }
}

function shareFocus(){
  // 記録があれば、いちばん高いバーを跳んだ回。なければ、いちばん高く上がった回
  const ok = G_.log.filter(l=>l.ok);
  if(ok.length) return { best:true, l: ok.reduce((a,b)=> b.bar>=a.bar ? b : a) };

function shareText(){

function drawCard(){

  c.fillStyle=TAR; c.fillRect(0,H-26,W,26);

    c.fillStyle=SIG; c.font=`800 210px ${NUM}`; c.fillText(a, X-6, 384); let x = X-6 + c.measureText(a).width + 6;
    c.font=`800 86px ${NUM}`; c.fillText('m', x, 384); x += c.measureText('m').width + 6;
    c.font=`800 210px ${NUM}`; c.fillText(b, x, 384);
  } else {
    c.fillStyle=SIG; c.font=`800 104px ${JP}`; c.fillText('記録なし', X, 360);
  }
  c.fillStyle=PAPER; c.font=`800 38px ${JP}`;
  let sub = '';
  if(f.best) sub = `${ITEMS[l.item].name}で跳んだ`;

  c.fillText(sub, X, 448);

    c.fillStyle='#ffffff1f'; c.beginPath(); c.roundRect ? c.roundRect(X+sw+16, 418, fw, 40, 20) : c.rect(X+sw+16, 418, fw, 40); c.fill();
    c.fillStyle=PAPER; c.fillText(fm, X+sw+30, 447); }

    else { c.strokeStyle='#E8705E'; c.beginPath(); c.moveTo(mx+4,500); c.lineTo(mx+24,520); c.moveTo(mx+24,500); c.lineTo(mx+4,520); c.stroke(); }
    mx += 36; });
  c.fillStyle='#FBF8F1aa'; c.font=`800 24px ${JP}`; c.fillText(`${TAG}　${SITE_URL.replace(/^https?:\/\//,'').replace(/\/$/,'')}`, X, 576);
  // 右：描いた竿だけを大きく（方眼紙・人・バーは置かない）。長さは上に
  const BX=660, BY=230, BW=470, BH=320;

    c.font=`800 44px ${NUM}`; const lt = `${(l.L||0).toFixed(1)}m`, ltw = c.measureText(lt).width;

    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; pts.forEach(p=>{ x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); });
    const m = Math.min(BW/Math.max(0.5,x1-x0), BH/Math.max(0.5,y1-y0), 150);
    const ox = BX + (BW-(x1-x0)*m)/2 - x0*m, oy = BY + BH - (BH-(y1-y0)*m)/2 + y0*m;
    let q = pts.map(p=>({x:ox+p.x*m, y:oy-p.y*m})); if(l.rev) q = q.reverse();

      }

$('bPost').onclick = ()=>{
  if(!endReady()) return;
  SFX.tick();
  const u = 'https://x.com/intent/post?text=' + encodeURIComponent(SHARE.text || shareText());
  window.open(u, '_blank', 'noopener');
};

// ===== 音の切りかえ =====
function syncSnd(){ const b=$('snd'); b.querySelector('b').textContent = CFG.sound?'ON':'OFF'; b.classList.toggle('off',!CFG.sound); b.setAttribute('aria-pressed', CFG.sound?'true':'false'); }
$('snd').onclick = ()=>{ CFG.sound=!CFG.sound; try{ localStorage.setItem('nandemo-vault-sound', CFG.sound?'on':'off'); }catch(e){} syncSnd(); if(CFG.sound) tone(880,0.08,'triangle',0.12); };
syncSnd(); $('snd').hidden = $('title').hidden;

(()=>{ const lu = $('lineup'); ITEM_IDS.forEach(id=>{ const f = document.createElement('figure'); f.appendChild(iconCanvas(id, 50)); const c = document.createElement('figcaption'); c.textContent = ITEMS[id].name; f.appendChild(c); lu.appendChild(f); }); $('nItems').textContent = ITEM_IDS.length + '種'; })();
resize(); startDemo(); requestAnimationFrame(frame);
// 記録画面のまま読み込み直されたとき（30分以内）は、記録画面から再開する
try{ const sv = JSON.parse(sessionStorage.getItem(END_KEY)||'null');
  if(sv && Date.now()-sv.t < 30*60*1000 && Array.isArray(sv.log) && sv.log.length && sv.log.every(l=> ITEMS[l.item] && FORMS[l.form])){ G_.log = sv.log; G_.best = sv.best; toEnd(); endAt = 0; } }catch(e){}
})();
